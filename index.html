<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calm Input UI</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #E3E3E3;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    font-family: "Roboto Mono", monospace;
  }

  .input-box::placeholder {
    color: rgba(0, 0, 0, 0.3);
    font-size: 24px;
    line-height: 32px;
  }

  .text-block {
    display: flex;
    flex-direction: column;
    gap: 16px;

    width: 318px;
    padding-bottom: 16px;

    text-align: left;
  }

  .text-top {
    font-size: 24px;
    line-height: 24px;
    white-space: pre;
  }

  .text-bottom {
    font-size: 24px;
    line-height: 24px;
  }

  .input-box {
    width: 318px;
    height: 108px;

    background: #FFFFFF;
    box-sizing: border-box;

    border-top: 2px solid #000000;
    border-bottom: 2px solid #000000;
    border-left: none;
    border-right: none;

    outline: none;
    box-shadow: none;

    padding: 16px;

    font-size: 24px;
    line-height: 34px;

    resize: none;

    font-family: "Roboto Mono", monospace;
  }

  .bottom-bar {
    width: 318px;
    height: 56px;

    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .counter {
    font-size: 24px;
    line-height: 32px;
    color: #000000;
  }

  .send-btn {
    height: 56px;
    background: none;
    border: none;
    padding: 0;

    font-size: 24px;
    font-family: "Roboto Mono", monospace;

    color: #000000;
    cursor: pointer;
  }

  .send-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
</style>
</head>

<body>

<div class="text-block">
  <div class="text-top">       ,,,<br>Hey! \(•ᴗ•)/</div>
  <div class="text-bottom">How are you today?</div>
</div>

<textarea class="input-box" placeholder="Write down how you feel..."></textarea>

<div class="bottom-bar">
  <div class="counter">0/32</div>
  <button class="send-btn" disabled>(Send)</button>
</div>

<script>
const textarea = document.querySelector(".input-box");
const counter = document.querySelector(".counter");
const sendBtn = document.querySelector(".send-btn");

const MAX = 32;

// ================= UI =================
function updateUI() {
  const len = textarea.value.length;
  counter.textContent = `${len}/${MAX}`;
  sendBtn.disabled = len === 0;
}

// ================= SEND =================
async function sendMessage() {
    console.log("SEND");
  const text = textarea.value.trim();
  if (!text) return;

  sendBtn.disabled = true;

  try {
    await fetch("http://www.calmquiet.space/push", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": "bespaw-5sesso-pekPeb"
      },
      body: JSON.stringify({ text })
    });

    // 🔥 ЖЁСТКАЯ ОЧИСТКА (важно)
    textarea.value = "";
    textarea.textContent = "";   // страховка
    textarea.dispatchEvent(new Event("input")); // принудительно обновляем UI

    textarea.blur();
    updateUI();

  } catch (e) {
    console.log("SEND ERROR", e);
  }
}

// ================= EVENTS =================

// ввод
textarea.addEventListener("input", () => {
  if (textarea.value.length > MAX) {
    textarea.value = textarea.value.slice(0, MAX);
  }
  updateUI();
});

// кнопка
sendBtn.addEventListener("click", sendMessage);

// Enter → send
textarea.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// init
updateUI();
</script>

</body>
</html>
